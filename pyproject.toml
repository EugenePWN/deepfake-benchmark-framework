[tool.poetry]
name = "deepfake-benchmark"
version = "0.1.0"
description = ""
authors = ["Eugene <eugene-kk@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14.1"
pydantic = "^2.12.5"
pyyaml = "^6.0.2"
datasets = "^4.8.4"
torch = "^2.11.0"
torchvision = "^0.26.0"

[tool.poetry.group.dev.dependencies]
black = "^25.11.0"
isort = "^7.0.0"
mypy = "^1.18.2"
pytest = "^9.0.1"
pre-commit = "^4.4.0"
types-pyyaml = "^6.0.12.20250915"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disable_error_code = ["no-untyped-call"]
packages = ["deepfake_benchmark"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]